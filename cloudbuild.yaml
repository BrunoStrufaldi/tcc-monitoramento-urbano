# Deploy automático do MotSP.
#
# O Cloud Build roda este arquivo a cada push na branch main do GitHub. Faz o
# mesmo que o deploy.ps1, mas a partir do repositório. Por isso os modelos do
# YOLO usados pelo sistema precisam estar no Git.
#
# O deploy.ps1 continua valendo para o deploy manual.

substitutions:
  _REGION: southamerica-east1
  _SERVICE: motsp
  # Repositório criado no primeiro deploy manual (deploy.ps1).
  _REPO: southamerica-east1-docker.pkg.dev

# O caminho da imagem é repetido em cada passo porque o Cloud Build não
# expande $PROJECT_ID dentro de uma substituição.
steps:
  # 1. Monta a imagem com o Dockerfile da raiz.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${COMMIT_SHA}
      - --tag=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:latest
      - .

  # 2. Envia a imagem para o Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}

  # 3. Publica a nova versão no Cloud Run. As variáveis já configuradas no
  #    serviço são mantidas.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

# Instalar o torch demora mais que os 10 min padrão do Cloud Build.
timeout: 1800s

options:
  # Necessário em projetos novos, que usam a conta de serviço do Compute.
  logging: CLOUD_LOGGING_ONLY
