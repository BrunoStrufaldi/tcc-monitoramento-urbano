# Deploy automático do MotSP.
#
# O gatilho "motsp-main" do Cloud Build roda este arquivo a cada push na
# branch main do GitHub. Faz o mesmo que o deploy.ps1, só que a partir do
# repositório em vez da máquina local — por isso os dois pesos do YOLO
# (ml/models/yolo11m.pt e gx-incident.pt) precisam estar commitados.
#
# O deploy.ps1 continua valendo para deploy manual.

substitutions:
  _REGION: southamerica-east1
  _SERVICE: motsp
  # Repositório criado pelo primeiro `gcloud run deploy --source` (deploy.ps1).
  _REPO: southamerica-east1-docker.pkg.dev

# O caminho da imagem é repetido nos passos em vez de virar uma substituição
# (_IMAGE): $PROJECT_ID dentro do valor de uma substituição NÃO é expandido —
# nem com dynamic_substitutions — e o docker recebia a tag literal
# "...pkg.dev/$PROJECT_ID/..." ("repository name must be lowercase"). Nos
# args dos passos as variáveis embutidas sempre expandem.
steps:
  # 1. Builda a imagem com o Dockerfile da raiz (o mesmo do deploy manual).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${COMMIT_SHA}
      - --tag=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:latest
      - .

  # 2. Envia a imagem para o Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}

  # 3. Publica uma nova revisão no Cloud Run. Sem --set-env-vars de propósito:
  #    memória, CPU, min/max-instances, TOMTOM_API_KEY e as demais variáveis já
  #    configuradas no serviço são preservadas de uma revisão para a outra.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

# Instalar o torch passa dos 10 min padrão de build (mesmo motivo do
# `builds/timeout 1800` no deploy.ps1).
timeout: 1800s

options:
  # Obrigatório quando a build roda com a conta de serviço do Compute (o
  # padrão em projetos novos) em vez da conta legada do Cloud Build.
  logging: CLOUD_LOGGING_ONLY
